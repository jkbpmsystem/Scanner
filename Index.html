<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<title>PPM Asset Scanner</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#eaf2ff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#0b1422;border:1px solid #18304a;border-radius:18px;padding:18px;box-shadow:0 10px 35px rgba(0,0,0,.35)}h1{font-size:20px;margin:0 0 6px}.sub{color:#91a4bb;font-size:13px;margin-bottom:16px}#reader{width:100%;overflow:hidden;border-radius:14px;background:#000;min-height:280px}#message{text-align:center;color:#91a4bb;font-size:14px;line-height:1.6;padding:14px 4px}button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:8px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:#00e676;color:#001b0c}.secondary{background:#172438;color:#dce8f7}.danger{background:#ff526d;color:#fff}.ok{color:#00e676}.err{color:#ff6b81}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>PPM Asset Scanner</h1><div class="sub">Scan Barcode / QR Code untuk mendapatkan Asset No.</div>
<div id="reader"></div><div id="message">Tekan START CAMERA untuk mula.</div>
<button class="primary" id="startBtn" onclick="startScanner()">START CAMERA</button>
<button class="secondary" onclick="manualSearch()">ENTER ASSET NO MANUALLY</button>
<button class="danger" onclick="window.close()">CLOSE</button>
</div></div>
<script>
let scanner=null,running=false,resultSent=false;const message=document.getElementById('message'),startBtn=document.getElementById('startBtn');
function setMessage(html){message.innerHTML=html}
async function startScanner(){if(running)return;resultSent=false;if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setMessage('<span class="err">Camera memerlukan HTTPS.</span>');return}if(typeof Html5Qrcode==='undefined'){setMessage('<span class="err">Scanner library gagal dimuatkan.</span>');return}startBtn.disabled=true;setMessage('Meminta kebenaran kamera...');try{scanner=new Html5Qrcode('reader');const config={fps:10,aspectRatio:1.7777778,qrbox:function(w,h){const size=Math.floor(Math.min(w,h)*.72);return{width:Math.max(180,Math.min(size,360)),height:Math.max(180,Math.min(size,360))}},formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.CODE_93,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]};await scanner.start({facingMode:{ideal:'environment'}},config,onScanSuccess,function(){});running=true;startBtn.textContent='CAMERA RUNNING';setMessage('<span class="ok">Camera aktif.</span><br>Halakan kamera kepada Barcode / QR Code.')}catch(e){console.error(e);running=false;startBtn.disabled=false;startBtn.textContent='START CAMERA';let msg=e&&e.message?e.message:'Unknown camera error';if(e&&(e.name==='NotAllowedError'||e.name==='PermissionDeniedError'))msg='Akses kamera ditolak. Benarkan Camera untuk browser ini dan cuba semula.';else if(e&&e.name==='NotFoundError')msg='Kamera tidak dijumpai pada peranti.';else if(e&&(e.name==='NotReadableError'||e.name==='TrackStartError'))msg='Kamera sedang digunakan oleh aplikasi lain.';setMessage('<span class="err">'+escapeHtml(msg)+'</span>');scanner=null}}
async function onScanSuccess(decodedText){if(!decodedText||resultSent)return;resultSent=true;const assetNo=String(decodedText).trim();setMessage('<span class="ok">Scan berjaya!</span><br>Asset No: <b>'+escapeHtml(assetNo)+'</b><br>Menghantar kepada PPM System...');await stopScanner();if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'PPM_ASSET_SCAN',assetNo:assetNo},'*');setTimeout(()=>window.close(),500)}else setMessage('<span class="err">PPM System tidak dijumpai.</span><br>Asset No: <b>'+escapeHtml(assetNo)+'</b>')}
async function stopScanner(){if(!scanner)return;const s=scanner;scanner=null;running=false;try{if(typeof s.isScanning==='function'&&s.isScanning())await s.stop()}catch(e){}try{await s.clear()}catch(e){}startBtn.disabled=false;startBtn.textContent='START CAMERA'}
function manualSearch(){const assetNo=prompt('Masukkan Asset No:');if(!assetNo||!assetNo.trim())return;if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'PPM_ASSET_SCAN',assetNo:assetNo.trim()},'*');window.close()}}
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
window.addEventListener('beforeunload',stopScanner);
</script>
</body></html>
