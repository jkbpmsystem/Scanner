<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PPM Asset Scanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--bg:#07111f;--card:#101f33;--border:#1d3855;--text:#e8f1fa;--muted:#8fa8c1;--cyan:#18d9ff;--blue:#35a7ff;--green:#35d07f;--red:#ff5c72}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#102c48 0%,var(--bg) 48%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:18px}.cardx{background:linear-gradient(145deg,var(--card),#0b1828);border:1px solid var(--border);border-radius:18px;padding:18px}.title{font-weight:700;font-size:20px}.sub,.status{color:var(--muted);font-size:12px}.reader{width:100%;min-height:340px;overflow:hidden;border-radius:14px;background:#02070d;border:1px solid var(--border)}#reader video{width:100%!important;border-radius:14px}.btn-scan{background:linear-gradient(135deg,#178be5,#18c8e8);border:0;color:#001321;font-weight:700}.manual{background:#0b192b;color:#fff;border:1px solid var(--border)}.asset{font-size:22px;font-weight:700;color:var(--cyan);word-break:break-all}
</style>
</head>
<body>
<div class="wrap"><div class="cardx">
<div class="d-flex align-items-center gap-3 mb-2"><i class="bi bi-upc-scan fs-2" style="color:var(--cyan)"></i><div><div class="title">PPM ASSET SCANNER</div><div class="sub">Scan Barcode / QR Code</div></div></div>
<div id="status" class="status mb-3">Memulakan scanner...</div>
<div id="reader" class="reader"></div>
<div id="result" class="text-center mt-3"></div>
<div class="mt-3"><label class="form-label small">Atau masukkan Asset No secara manual</label><div class="input-group"><input id="manualAsset" class="form-control manual" placeholder="Contoh: MECH-0001"><button id="sendBtn" class="btn btn-scan">Hantar</button></div></div>
</div></div>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
let scanner=null,sent=false;
const statusEl=document.getElementById('status');
const params=new URLSearchParams(location.search);
const returnUrl=params.get('returnUrl');
function setStatus(t){statusEl.textContent=t}
function clean(v){return String(v||'').trim()}
function goBack(assetNo) {

  if (sent) return;

  const v = clean(assetNo);

  if (!v) return;

  sent = true;

  setStatus('Scan berjaya. Kembali ke sistem PPM...');

  document.getElementById('result').innerHTML =
    '<div class="asset">' +
    escapeHtml(v) +
    '</div>' +
    '<div class="status mt-2">Kembali ke sistem PPM...</div>';

  const finish = () => {

    if (returnUrl) {

      try {

        const u = new URL(returnUrl);

        // Masukkan Asset No
        u.searchParams.set('assetNo', v);

        // Terus balik ke sistem
        window.location.replace(u.toString());

        return;

      } catch (e) {

        console.error('Return URL error:', e);

      }

    }

    setStatus(
      'Asset No berjaya dibaca. Sila kembali ke sistem PPM.'
    );
  };

  if (scanner) {

    scanner.stop()
      .catch(() => {})
      .finally(() => {

        try {
          scanner.clear();
        } catch (e) {}

        document.getElementById('reader').innerHTML = '';

        // Beri masa kamera ditutup
        setTimeout(finish, 200);

      });

  } else {

    finish();

  }
}
async function start(){
 if(typeof Html5Qrcode==='undefined'){setStatus('Scanner library gagal dimuat.');return}
 scanner=new Html5Qrcode('reader');
 const config={fps:15,qrbox:(w,h)=>{const size=Math.floor(Math.min(w,h)*.72);return {width:Math.max(220,Math.min(size,420)),height:Math.max(220,Math.min(size,420))}}};
 try{await scanner.start({facingMode:'environment'},config,(text)=>goBack(text),()=>{});setStatus('Halakan QR Code / barcode ke dalam kotak.')}catch(e){console.error(e);setStatus('Kamera tidak dapat dibuka. Pastikan permission kamera dibenarkan.')}
}
document.getElementById('sendBtn').addEventListener('click',()=>goBack(document.getElementById('manualAsset').value));
document.getElementById('manualAsset').addEventListener('keydown',e=>{if(e.key==='Enter')goBack(e.target.value)});
function escapeHtml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
window.addEventListener('load',start);
</script>
</body></html>
