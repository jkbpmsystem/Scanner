<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PPM Asset Scanner</title>

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet">

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  rel="stylesheet">

<style>

:root{
  --bg:#07111f;
  --card:#101f33;
  --border:#1d3855;
  --text:#e8f1fa;
  --muted:#8fa8c1;
  --cyan:#18d9ff;
  --blue:#35a7ff;
  --green:#35d07f;
  --red:#ff5c72;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at 20% 0%,
      #102c48 0%,
      var(--bg) 48%
    );
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

.wrap{
  max-width:620px;
  margin:auto;
  padding:18px;
}

.cardx{
  background:
    linear-gradient(
      145deg,
      var(--card),
      #0b1828
    );
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
}

.title{
  font-weight:700;
  font-size:20px;
}

.sub,
.status{
  color:var(--muted);
  font-size:12px;
}

.reader{
  width:100%;
  min-height:340px;
  overflow:hidden;
  border-radius:14px;
  background:#02070d;
  border:1px solid var(--border);
}

#reader video{
  width:100%!important;
  height:auto!important;
  border-radius:14px;
  object-fit:cover;
}

.btn-scan{
  background:
    linear-gradient(
      135deg,
      #178be5,
      #18c8e8
    );
  border:0;
  color:#001321;
  font-weight:700;
}

.btn-scan:active{
  transform:scale(.98);
}

.manual{
  background:#0b192b;
  color:#fff;
  border:1px solid var(--border);
}

.manual::placeholder{
  color:#8fa8c1;
}

.asset{
  font-size:22px;
  font-weight:700;
  color:var(--cyan);
  word-break:break-all;
}

.camera-status{
  min-height:20px;
}

</style>
</head>

<body>

<div class="wrap">

  <div class="cardx">

    <!-- HEADER -->

    <div class="d-flex align-items-center gap-3 mb-2">

      <i
        class="bi bi-upc-scan fs-2"
        style="color:var(--cyan)">
      </i>

      <div>

        <div class="title">
          PPM ASSET SCANNER
        </div>

        <div class="sub">
          Scan Barcode / QR Code
        </div>

      </div>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="status camera-status mb-3">

      Tekan MULA SCAN untuk menggunakan kamera.

    </div>


    <!-- CAMERA -->

    <div
      id="reader"
      class="reader">
    </div>


    <!-- START CAMERA BUTTON -->

    <button
      id="startBtn"
      type="button"
      class="btn btn-scan w-100 mt-3">

      <i class="bi bi-camera-fill me-2"></i>

      MULA SCAN

    </button>


    <!-- RESULT -->

    <div
      id="result"
      class="text-center mt-3">
    </div>


    <!-- MANUAL -->

    <div class="mt-3">

      <label class="form-label small">

        Atau masukkan Asset No secara manual

      </label>

      <div class="input-group">

        <input
          id="manualAsset"
          class="form-control manual"
          placeholder="Contoh: SZA00018F"
          autocomplete="off"
          autocapitalize="characters">

        <button
          id="sendBtn"
          type="button"
          class="btn btn-scan">

          Hantar

        </button>

      </div>

    </div>

  </div>

</div>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<script>

let scanner = null;

let scannerRunning = false;

let sent = false;


/* ==========================================
   BASIC
========================================== */

const statusEl =
  document.getElementById('status');

const readerEl =
  document.getElementById('reader');

const params =
  new URLSearchParams(location.search);

const returnUrl =
  params.get('returnUrl');


function setStatus(text){

  statusEl.textContent = text;

}


function clean(value){

  return String(value || '').trim();

}


/* ==========================================
   START CAMERA
========================================== */

async function startScanner() {

  if (scannerRunning) return;

  if (typeof Html5Qrcode === 'undefined') {
    setStatus('Scanner library gagal dimuat.');
    return;
  }

  try {

    setStatus('Mencari kamera...');

    // Dapatkan senarai kamera
    const cameras = await Html5Qrcode.getCameras();

    console.log('Available cameras:', cameras);

    if (!cameras || cameras.length === 0) {
      throw new Error('NO_CAMERA');
    }

    // Cuba cari kamera belakang
    let camera = cameras.find(c =>
      /back|rear|environment|belakang/i.test(c.label)
    );

    // Kalau tak jumpa, guna kamera pertama
    if (!camera) {
      camera = cameras[0];
    }

    console.log('Selected camera:', camera);

    setStatus(
      'Membuka kamera: ' +
      (camera.label || 'Camera')
    );

    scanner = new Html5Qrcode('reader');

    const config = {
      fps: 10,

      qrbox: function(width, height) {

        const minEdge = Math.min(width, height);

        const boxWidth = Math.floor(minEdge * 0.75);
        const boxHeight = Math.floor(minEdge * 0.45);

        return {
          width: Math.max(
            220,
            Math.min(boxWidth, 420)
          ),

          height: Math.max(
            120,
            Math.min(boxHeight, 280)
          )
        };
      }
    };

    await scanner.start(
      camera.id,
      config,

      function(decodedText) {

        console.log(
          'Barcode detected:',
          decodedText
        );

        handleScan(decodedText);

      },

      function(errorMessage) {

        // Jangan papar error setiap frame
        console.debug(
          'Scan:',
          errorMessage
        );

      }
    );

    scannerRunning = true;

    setStatus(
      'Kamera aktif. Halakan kamera kepada barcode aset.'
    );

    const startBtn =
      document.getElementById('startBtn');

    startBtn.innerHTML =
      '<i class="bi bi-camera-fill me-2"></i>' +
      'KAMERA AKTIF';

    startBtn.disabled = true;

  }

  catch(error) {

    console.error(
      'Camera error:',
      error
    );

    scannerRunning = false;
    scanner = null;

    let message =
      'Kamera tidak dapat dibuka.';

    if (error.message === 'NO_CAMERA') {

      message =
        'Tiada kamera dikesan oleh browser.';

    }
    else if (
      error.name === 'NotAllowedError'
    ) {

      message =
        'Akses kamera ditolak. Sila benarkan kamera untuk browser.';

    }
    else if (
      error.name === 'NotFoundError'
    ) {

      message =
        'Kamera tidak dijumpai pada peranti.';

    }
    else if (
      error.name === 'NotReadableError'
    ) {

      message =
        'Kamera sedang digunakan oleh aplikasi lain.';

    }
    else if (
      error.name === 'SecurityError'
    ) {

      message =
        'Browser menyekat akses kamera. Pastikan laman menggunakan HTTPS.';

    }

    setStatus(message);

    alert(
      message +
      '\n\nError: ' +
      error.message
    );

  }
}


/* ==========================================
   STOP CAMERA
========================================== */

async function stopScanner(){

  if(
    !scanner ||
    !scannerRunning
  ){

    return;

  }


  try{

    await scanner.stop();

  }

  catch(error){

    console.warn(
      'Scanner stop:',
      error
    );

  }


  try{

    scanner.clear();

  }

  catch(error){

    console.warn(
      'Scanner clear:',
      error
    );

  }


  scannerRunning = false;

  scanner = null;

}


/* ==========================================
   HANDLE SCAN
========================================== */

function handleScan(decodedText){

  const assetNo =
    clean(decodedText)
      .toUpperCase();


  if(!assetNo){

    return;

  }


  console.log(
    'Scanned Asset No:',
    assetNo
  );


  goBack(assetNo);

}


/* ==========================================
   RETURN AFTER SCAN
========================================== */

function goBack(assetNo){

  if(sent){

    return;

  }


  const v =
    clean(assetNo)
      .toUpperCase();


  if(!v){

    return;

  }


  sent = true;


  setStatus(
    'Asset berjaya dibaca. Kembali ke sistem PPM...'
  );


  document.getElementById(
    'result'
  ).innerHTML =

    '<div class="asset">' +
      escapeHtml(v) +
    '</div>' +

    '<div class="status mt-2">' +
      'Kembali ke sistem PPM...' +
    '</div>';


  stopScanner()
    .finally(function(){

      returnToSystem(v);

    });

}


/* ==========================================
   RETURN TO SYSTEM
========================================== */

function returnToSystem(assetNo){

  if(!returnUrl){

    setStatus(
      'Return URL tidak ditetapkan.'
    );

    return;

  }


  try{

    const u =
      new URL(returnUrl);


    /*
      Hantar Asset No
    */

    u.searchParams.set(
      'assetNo',
      assetNo
    );


    console.log(
      'Returning to:',
      u.toString()
    );


    /*
      Return ke PPM
    */

    window.location.replace(
      u.toString()
    );

  }

  catch(error){

    console.error(
      'Return URL error:',
      error
    );


    setStatus(
      'Gagal kembali ke sistem PPM.'
    );

  }

}


/* ==========================================
   MANUAL ASSET
========================================== */

function goBackManual(assetNo){

  const v =
    clean(assetNo)
      .toUpperCase();


  if(!v){

    alert(
      'Sila masukkan Asset No.'
    );

    return;

  }


  if(!returnUrl){

    alert(
      'Return URL tidak ditetapkan.'
    );

    return;

  }


  sent = true;


  try{

    const u =
      new URL(returnUrl);


    u.searchParams.set(
      'assetNo',
      v
    );


    console.log(
      'Manual return:',
      u.toString()
    );


    window.location.replace(
      u.toString()
    );

  }

  catch(error){

    console.error(
      'Manual return error:',
      error
    );


    alert(
      'Gagal kembali ke sistem PPM.'
    );

  }

}


/* ==========================================
   BUTTON - START CAMERA
========================================== */

document
  .getElementById('startBtn')
  .addEventListener(
    'click',
    function(){

      startScanner();

    }
  );


/* ==========================================
   BUTTON - MANUAL
========================================== */

document
  .getElementById('sendBtn')
  .addEventListener(
    'click',
    function(){

      const input =
        document.getElementById(
          'manualAsset'
        );


      const value =
        input.value.trim();


      if(!value){

        alert(
          'Sila masukkan Asset No.'
        );

        input.focus();

        return;

      }


      goBackManual(value);

    }
  );


/* ==========================================
   ENTER - MANUAL
========================================== */

document
  .getElementById('manualAsset')
  .addEventListener(
    'keydown',
    function(event){

      if(
        event.key === 'Enter'
      ){

        event.preventDefault();

        const value =
          this.value.trim();


        if(!value){

          alert(
            'Sila masukkan Asset No.'
          );

          return;

        }


        goBackManual(value);

      }

    }
  );


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

</script>

</body>
</html>
