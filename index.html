<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PPM Asset Scanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--bg:#07111f;--card:#101f33;--border:#1d3855;--text:#e8f1fa;--muted:#8fa8c1;--cyan:#18d9ff;--blue:#35a7ff;--green:#35d07f;--red:#ff5c72}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#102c48 0%,var(--bg) 48%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
.wrap{max-width:620px;margin:auto;padding:18px}.cardx{background:linear-gradient(145deg,var(--card),#0b1828);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
.title{font-weight:700;font-size:20px}.sub{color:var(--muted);font-size:12px}.reader{width:100%;min-height:300px;overflow:hidden;border-radius:14px;background:#02070d;border:1px solid var(--border)}
#reader video{width:100%!important;border-radius:14px}.status{font-size:12px;color:var(--muted)}.btn-scan{background:linear-gradient(135deg,#178be5,#18c8e8);border:0;color:#001321;font-weight:700}.asset{font-size:22px;font-weight:700;color:var(--cyan);word-break:break-all}.manual{background:#0b192b;color:#fff;border:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <div class="cardx">
    <div class="d-flex align-items-center gap-3 mb-2"><i class="bi bi-upc-scan fs-2" style="color:var(--cyan)"></i><div><div class="title">PPM ASSET SCANNER</div><div class="sub">Scan Barcode / QR Code</div></div></div>
    <div id="status" class="status mb-3">Memulakan scanner...</div>
    <div id="reader" class="reader"></div>
    <div id="result" class="text-center mt-3"></div>
    <div class="mt-3">
      <label class="form-label small">Atau masukkan Asset No secara manual</label>
      <div class="input-group"><input id="manualAsset" class="form-control manual" placeholder="Contoh: MECH-0001"><button class="btn btn-scan" onclick="sendAsset(document.getElementById('manualAsset').value)">Hantar</button></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
let scanner=null, sent=false;
const statusEl=document.getElementById('status');
function setStatus(t){statusEl.textContent=t;}
async function start(){
  if(typeof Html5Qrcode==='undefined'){setStatus('Scanner library gagal dimuat.');return;}
  scanner=new Html5Qrcode('reader');
  const config={fps:10,qrbox:(w,h)=>({width:Math.max(220,Math.min(Math.floor(w*.82),420)),height:Math.max(140,Math.min(Math.floor(h*.45),220))}),formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.CODE_93,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]};
  try{
    setStatus('Meminta akses kamera...');
    await scanner.start({facingMode:'environment'},config,onScan,()=>{});
    setStatus('Halakan kamera kepada barcode / QR Code Asset No.');
  }catch(e){
    console.error(e);setStatus('Kamera tidak dapat dibuka. Pastikan permission kamera dibenarkan dan laman dibuka melalui HTTPS.');
  }
}
async function onScan(decodedText){
  if(sent)return;
  const v=String(decodedText||'').trim();
  if(!v)return;
  sent=true;
  setStatus('Scan berjaya. Menghantar Asset No...');
  document.getElementById('result').innerHTML='<div class="asset">'+escapeHtml(v)+'</div><div class="status mt-2">Scanner dihentikan. Kembali ke sistem PPM...</div>';
  try{if(scanner){await scanner.stop();}}catch(e){console.warn(e)}
  try{if(scanner){await scanner.clear();}}catch(e){console.warn(e)}
  document.getElementById('reader').innerHTML='';
  if(window.opener&&!window.opener.closed){
    window.opener.postMessage({type:'PPM_ASSET_SCAN',assetNo:v},'*');
    setTimeout(()=>window.close(),500);
  } else {
    setStatus('Scan berjaya. Sila tutup halaman ini dan kembali ke sistem PPM.');
  }
}
function sendAsset(v){v=String(v||'').trim();if(v)onScan(v)}
function escapeHtml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
window.addEventListener('load',start);
</script>
</body></html>
